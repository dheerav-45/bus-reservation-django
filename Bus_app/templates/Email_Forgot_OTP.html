<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Verify Email - OTP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background-color: #007bff;
      padding: 22px;
    }

    /* OTP Container */
    .otp-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 40px 35px;
      width: 100%;
      max-width: 450px;
      margin: 90px auto 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      font-size: 42px;
      font-weight: 400;
      color: #4a9bde;
      font-style: italic;
      font-family: 'Brush Script MT', cursive;
    }

    .form-header {
      margin-bottom: 15px;
      text-align: center;
    }

    .form-header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-header p {
      color: #6b7280;
      font-size: 15px;
    }

    /* OTP Input */
    .otp-input {
      text-align: center;
      letter-spacing: 10px;
      font-size: 22px;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .otp-input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
      outline: none;
    }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 14px;
      background-color: #4ade80;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 20px;
    }

    .submit-btn:hover {
      background-color: #3266d8;
      color: #fff;
    }

    /* Resend OTP */
    .resend-text {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      color: #6b7280;
    }

    .resend-text a {
      color: #3b82f6;
      font-weight: 500;
      text-decoration: none;
    }

    .resend-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-light" style="margin-left: 200px;" href="{% url 'Home' %}">
        &#128652; QuickBus
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto" style="margin-right: 200px;">
          <li class="nav-item">
            <a class="nav-link text-light" href="{% url 'Home' %}">
              <i class="bi bi-house-door-fill me-1"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-light" href="{% url 'Email_Login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- OTP Box -->
  <div class="otp-container" data-aos="zoom-in">
    <div class="logo">
      <h1>QuickBus</h1>
    </div>
    <div class="form-header">
      <i class="bi bi-envelope-check-fill text-primary" style="font-size: 2.5rem;"></i>
      <h2>Verify Your Email</h2>
      <p>Please enter the 4-digit OTP sent to your email address.</p>
    </div>

    <form method="POST" action="#" id="otpForm">
      {% csrf_token %}
      <div class="form-group">
        <input type="text" name="otp" id="otp" maxlength="4" pattern="\d{4}" class="form-control otp-input"
          placeholder="----" required>
        <div class="feedback text-danger small mt-2" id="otpFeedback" style="display: none;">
          OTP must be a 4-digit number.
        </div>
      </div>
      <button type="submit" class="submit-btn">Verify</button>
      <p class="resend-text">
        Didn't receive the code?
        <a href="{% url 'Email_Forgot_password' %}">Resend OTP</a>
      </p>
    </form>
  </div>



  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    const otpInput = document.getElementById("otp");
    const otpFeedback = document.getElementById("otpFeedback");

    function validateOTP() {
      const otpValue = otpInput.value.trim();
      if (!/^\d{4}$/.test(otpValue)) {
        otpInput.classList.add("is-invalid");
        otpFeedback.style.display = "block";
        return false;
      } else {
        otpInput.classList.remove("is-invalid");
        otpFeedback.style.display = "none";
        return true;
      }
    }

    otpInput.addEventListener("input", validateOTP);

    document.getElementById("otpForm").addEventListener("submit", function (e) {
      if (!validateOTP()) {
        e.preventDefault();
        alert("Please enter a valid 4-digit OTP.");
      }
    });

    AOS.init();
  </script>
</body>

</html>
