<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Reset Password - QuickBus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease-in-out;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .btn-primary {
      background-color: #4ade80;
      border: none;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #2ecc71;
    }

    .form-control:focus {
      border-color: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
    }

    .input-group-text {
      cursor: pointer;
      background: #fff;
      border-left: none;
    }

    .input-group .form-control {
      border-right: none;
    }
  </style>
</head>

<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow p-4" data-aos="fade-down">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'Home' %}">&#128652; QuickBus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav" data-aos="flip-down" data-aos-delay="300">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'Home' %}">
              <i class="bi bi-house-door-fill me-1"></i>Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'Phone_Login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>


  <div class="container py-5">
    <div class="row justify-content-center" style="margin-top: 10%;">
      <div class="col-md-6 col-lg-5" data-aos="zoom-in" data-aos-duration="1000">
        <div class="card rounded-4">
          <div class="card-body p-4">
            <h4 class="text-center mb-3" data-aos="fade-up">Reset Your Password</h4>
            <p class="text-muted text-center mb-4" data-aos="fade-up" data-aos-delay="150">
              OTP verified ✅ Now set a new password for your account.
            </p>

            <form action="#" method="POST">
              {% csrf_token %}


              <div class="mb-3" data-aos="fade-up" data-aos-delay="300">
                <label for="new_password" class="form-label">New Password</label>
                <div class="input-group">
                  <input type="password" name="new_password" id="new_password" class="form-control" required
                    minlength="4">
                  <span class="input-group-text" onclick="togglePassword('new_password', this)">
                    <i class="bi bi-eye-slash-fill"></i>
                  </span>
                </div>
              </div>

              <div class="mb-3" data-aos="fade-up" data-aos-delay="500">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <div class="input-group">
                  <input type="password" name="confirm_password" id="confirm_password" class="form-control" required
                    minlength="4">
                  <span class="input-group-text" onclick="togglePassword('confirm_password', this)">
                    <i class="bi bi-eye-slash-fill"></i>
                  </span>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100" data-aos="fade-up" data-aos-delay="700">
                <i class="bi bi-shield-lock-fill me-1"></i> Reset Password
              </button>

              <!-- Back to Login -->
              <div class="text-center mt-3" data-aos="fade-up" data-aos-delay="900">
                <a href="{% url 'Phone_Login' %}" class="small">⬅ Back to Login</a>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init();


    function togglePassword(id, el) {
      const input = document.getElementById(id);
      const icon = el.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye-slash-fill");
        icon.classList.add("bi-eye-fill");
      } else {
        input.type = "password";
        icon.classList.remove("bi-eye-fill");
        icon.classList.add("bi-eye-slash-fill");
      }
    }
  </script>
</body>

</html>
