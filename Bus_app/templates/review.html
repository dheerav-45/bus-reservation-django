<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Add Reviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">

  <style>
    body {
      background: #f9fbff;
    }

    .star-rating i {
      font-size: 1.6rem;
      cursor: pointer;
      color: #ccc;
      transition: transform 0.2s ease, color 0.2s ease-in-out;
    }

    .star-rating i:hover {
      transform: scale(1.2) rotate(-5deg);
      color: #ffca2c;
    }

    .star-rating i.active {
      color: #ffc107;
    }

    .review-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .review-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      transition: all 0.3s ease-in-out;
    }

    .btn-primary:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    .avatar {
      width: 40px;
      height: 40px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 10px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top shadow p-4" data-aos="fade-down">
    <div class="container">
      <a class="navbar-brand" href="{% url 'Home' %}">&#128652; QuickBus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'Home' %}">
              <i class="bi bi-house-door-fill me-1"></i>Home
            </a>
          </li>
          {% if user.is_authenticated %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>{{ user.username }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="{% url 'profile' %}">
                  <i class="bi bi-person-lines-fill me-2"></i>Your Account
                </a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'booked' %}">
                  <i class="bi bi-journal-check me-2"></i>Booking
                </a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <a class="dropdown-item" href="#"><i class="fa-solid fa-gear"></i> Settings</a>
              </li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li>
                <a class="dropdown-item text-danger" href="{% url 'logout' %}">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </a>
              </li>
            </ul>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'Phone_Login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row g-4" style="margin-top: 6%;">
      <div class="col-lg-4" data-aos="zoom-in">
        <div class="card shadow-sm review-card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Leave a Review {{bus.Bus_No}}</h5>
          </div>
          <div class="card-body">
            <form method="post">
              {% csrf_token %}
              <div class="mb-3" data-aos="fade-up" data-aos-delay="100">
                <label class="form-label">Rating</label>
                <div class="star-rating" id="starSelector">
                  {% for i in "12345" %}
                  <i class="bi bi-star" data-value="{{ i }}"></i>
                  {% endfor %}
                </div>
                <input type="hidden" name="rating" id="ratingInput" required>
              </div>
              <div class="mb-3" data-aos="fade-up" data-aos-delay="200">
                <label class="form-label">Comment</label>
                <textarea name="comment" rows="3" class="form-control"
                  placeholder="Write your experience..."></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100" data-aos="fade-up" data-aos-delay="300">
                Submit
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });

    const stars = document.querySelectorAll('#starSelector i');
    const ratingInput = document.getElementById('ratingInput');

    stars.forEach((star, index) => {
      star.addEventListener('click', () => {
        ratingInput.value = star.dataset.value;
        stars.forEach((s, i) => {
          s.classList.toggle('active', i <= index);
          s.classList.replace('bi-star', 'bi-star-fill');
          if (i > index) s.classList.replace('bi-star-fill', 'bi-star');
        });
      });
    });
  </script>
</body>

</html>
