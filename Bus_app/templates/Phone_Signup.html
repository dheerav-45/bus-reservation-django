{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Register with Phone Number</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    body {
      background: linear-gradient(to right, #2193b0, #6dd5ed);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .navbar {
      animation: slideDown 0.8s ease-out;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Card animation */
    .card {
      border-radius: 1.5rem;
      transition: all 0.3s ease-in-out;
      animation: fadeInUp 1s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Input animation */
    .form-control:focus {
      border-color: #2193b0;
      box-shadow: 0 0 10px rgba(33, 147, 176, 0.5);
      transform: scale(1.02);
      transition: 0.2s ease;
    }

    /* Button hover effect */
    .btn-primary {
      transition: all 0.3s ease-in-out;
    }

    .btn-primary:hover {
      background-color: #176d81;
      transform: scale(1.05);
    }

    @media (max-width: 576px) {
      .card-body {
        padding: 1.5rem;
      }

      h3 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>

<body>


  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow p-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'Home' %}">&#128652; QuickBus</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'Home' %}"><i
                class="bi bi-house-door-fill me-1"></i>Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'Phone_Login' %}"><i
                class="bi bi-box-arrow-in-right me-1"></i>login</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="text-center mb-4 fw-bold animate__animated animate__fadeIn">📱 Phone Registration</h3>

            <form action="#" method="POST">
              {% csrf_token %}

              <div class="mb-3">
                <label for="username" class="form-label">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                  <input type="text" name="username" id="username" class="form-control" placeholder="Enter your name"
                    required>
                </div>
              </div>

              <div class="mb-3">
                <label for="phone_number" class="form-label">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                  <input type="tel" name="phone_number" id="phone_number" class="form-control"
                    placeholder="+91 98765 43210" required>
                </div>
              </div>


              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                  <input type="password" name="password" id="password" class="form-control" placeholder="Enter password"
                    required>
                  <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye-slash" id="toggleIcon"></i>
                  </button>
                </div>
              </div>


              <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
              <p class="text-center mt-3 mb-0">
                Already have an account? <a href="{% url 'Phone_Login' %}" class="text-decoration-none">Login</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


  <script>
    const togglePassword = document.querySelector("#togglePassword");
    const passwordField = document.querySelector("#password");
    const toggleIcon = document.querySelector("#toggleIcon");

    togglePassword.addEventListener("click", function () {
      const type = passwordField.getAttribute("type") === "password" ? "text" : "password";
      passwordField.setAttribute("type", type);
      toggleIcon.classList.toggle("bi-eye");
      toggleIcon.classList.toggle("bi-eye-slash");
    });
  </script>

</body>

</html>
