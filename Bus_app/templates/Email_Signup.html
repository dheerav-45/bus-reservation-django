<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Email Register - QuickBus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /*navbar*/
    .navbar {
      background-color: #007bff;
      padding-bottom: 30px;
      padding-top: 24px;
    }

    /* Form container */
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 50px 40px;
      width: 100%;
      max-width: 500px;
      margin: 75px auto 40px;
    }

    .logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo h1 {
      font-size: 48px;
      font-weight: 400;
      color: #4a9bde;
      font-style: italic;
      font-family: 'Brush Script MT', cursive;
    }

    .form-header {
      margin-bottom: 30px;
      text-align: center;
    }

    .form-header h2 {
      font-size: 24px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
    }

    .login-link {
      color: #3b82f6;
      text-decoration: none;
      font-size: 16px;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .form-input:focus {
      border-color: #4ade80;
      box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
    }

    /* Validation states */
    .form-input.error {
      border-color: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.5);
    }

    .form-input.success {
      border-color: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
    }

    .feedback {
      font-size: 13px;
      margin-top: 5px;
      color: #ef4444;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    /* Password strength meter */
    .strength-meter {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    .weak {
      color: #ef4444;
    }

    .medium {
      color: #f59e0b;
    }

    .strong {
      color: #22c55e;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background-color: #4ade80;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin: 30px 0 20px;
    }

    .submit-btn:hover {
      background-color: #3266d8;
    }

    .security-notice {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      .logo h1 {
        font-size: 40px;
      }

      .navbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .navbar ul {
        flex-wrap: wrap;
        gap: 10px;
      }
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
      color: #9ca3af;
      transition: color 0.2s;
      user-select: none;
    }

    .toggle-password:hover {
      color: #4ade80;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg ">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold text-light" style="margin-left: 250px;" href="{% url 'Home' %}">&#128652;
        QuickBus</a>


      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav  ms-auto" style="margin-right: 250px;">

          <li class="nav-item">
            <a class="nav-link text-light" href="{% url 'Home' %}">
              <i class="bi bi-house-door-fill me-1"></i>Home
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link text-light" href="{% url 'Email_Login' %}">
              <i class="bi bi-box-arrow-in-right me-1"></i>Login
            </a>
          </li>

        </ul>
      </div>
    </div>
  </nav>


  <div class="container" data-aos="zoom-in">
    <div class="logo">
      <h1>QuickBus</h1>
    </div>

    <div class="form-header">
      <h2>Create an Account</h2>
      <span>Already have an account? <a href="{% url 'Email_Login' %}" class="login-link">Login</a></span>
    </div>

    <form method="POST" action="#" id="registerForm">
      {% csrf_token %}

      <div class="form-group">
        <input type="text" name="username" id="username" class="form-input" placeholder="Username" required>
        <div class="feedback" id="usernameFeedback">Username must be at least 3 characters.</div>
      </div>

      <div class="form-group">
        <input type="email" name="email" id="email" class="form-input" placeholder="Email Address" required>
        <div class="feedback" id="emailFeedback">Please enter a valid email.</div>
      </div>

      <div class="form-group password-wrapper">
        <input type="password" name="password" id="password" class="form-input" placeholder="Password" required>
        <span class="toggle-password" id="togglePassword"><i class="bi bi-eye-slash"></i></span>
        <div class="password-strength" id="passwordStrength"></div>
      </div>

      <button type="submit" class="submit-btn">Register</button>

      <p class="security-notice">By clicking the register button, you accept our.</p>
      <p class="security-notice">Terms and Conditions of this website.</p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <script>
    const username = document.getElementById("username");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    const usernameFeedback = document.getElementById("usernameFeedback");
    const emailFeedback = document.getElementById("emailFeedback");
    const passwordFeedback = document.getElementById("passwordFeedback");
    const strengthMeter = document.getElementById("strengthMeter");

    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";

      togglePassword.innerHTML = isPassword
        ? '<i class="bi bi-eye-slash"></i>'
        : '<i class="bi bi-eye"></i>';
    });
    function validateUsername() {
      if (username.value.trim().length < 3) {
        username.classList.add("error");
        username.classList.remove("success");
        usernameFeedback.classList.add("show");
        return false;
      } else {
        username.classList.remove("error");
        username.classList.add("success");
        usernameFeedback.classList.remove("show");
        return true;
      }
    }
    function validateEmail() {
      const pattern = /^[^ ]+@[^ ]+\.[a-z]{2,}$/;
      if (!pattern.test(email.value)) {
        email.classList.add("error");
        email.classList.remove("success");
        emailFeedback.classList.add("show");
        return false;
      } else {
        email.classList.remove("error");
        email.classList.add("success");
        emailFeedback.classList.remove("show");
        return true;
      }
    }
    function validatePassword() {
      const value = password.value;
      if (value.length < 6) {
        password.classList.add("error");
        password.classList.remove("success");
        passwordFeedback.classList.add("show");
        strengthMeter.textContent = "";
        return false;
      } else {
        password.classList.remove("error");
        password.classList.add("success");
        passwordFeedback.classList.remove("show");


        let strength = 0;
        if (/[a-z]/.test(value)) strength++;
        if (/[A-Z]/.test(value)) strength++;
        if (/[0-9]/.test(value)) strength++;
        if (/[^A-Za-z0-9]/.test(value)) strength++;

        if (strength <= 1) {
          strengthMeter.textContent = "Weak";
          strengthMeter.className = "strength-meter weak";
        } else if (strength === 2 || strength === 3) {
          strengthMeter.textContent = "Medium";
          strengthMeter.className = "strength-meter medium";
        } else if (strength >= 4) {
          strengthMeter.textContent = "Strong";
          strengthMeter.className = "strength-meter strong";
        }
        return true;
      }
    }
    username.addEventListener("input", validateUsername);
    email.addEventListener("input", validateEmail);
    password.addEventListener("input", validatePassword);

    document.getElementById("registerForm").addEventListener("submit", function (e) {
      if (!validateUsername() || !validateEmail() || !validatePassword()) {
        e.preventDefault();
        alert("Please fix the errors before submitting.");
      }
    });
  </script>


  <script>
    AOS.init();
  </script>

</body>

</html>
