{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Booking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: url("{% static 'images/bus-bg.jpg' %}") no-repeat center center fixed;
            background-size: cover;
        }

        .booking-card {
            background-color: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="booking-card mx-auto" style="max-width: 600px;">
            <h2 class="text-center mb-4">Book Your Seat</h2>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-info alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">User</label>
                    {{ form.user_Fk }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Bus</label>
                    {{ form.bus_Fk }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Seat Number</label>
                    {{ form.seat_no }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Passengers</label>
                    {{ form.passengers }}
                </div>

                <div class="text-center mt-4">
                    <button type="submit" class="btn btn-success px-4">Confirm Booking</button>
                    <a href="{% url 'Home' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
